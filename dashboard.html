<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — NARAGALIX</title><link rel="stylesheet" href="auth-style.css"></head><body><main><img class="logo" src="img/logo-naragalix.png" alt="Logo NARAGALIX"><section class="panel" style="max-width:780px;margin:auto;text-align:center"><span class="eyebrow">PANGKALAN ANTARGALAKSI</span><h1 id="welcome">Memuat data penjelajah...</h1><p class="formhint" id="info">Dashboard utama dan permainan 81 tantangan akan dikembangkan pada tahap berikutnya.</p><div><span class="pill">🪐 10 Pos</span><span class="pill">🧩 81 Titik</span><span class="pill">📚 5 Mapel</span></div><p class="note">Registrasi, login, dan pemilihan karakter sudah dapat tersimpan. Mesin tantangan belum diaktifkan.</p><button id="logout" class="action">Keluar Akun</button></section></main><script src="config.js"></script><script src="auth.js"></script><script>(async function(){const token=NGL.getToken();if(!token){location.replace('login.html');return;}try{const out=await NGL.api('session',{token});if(!out.player.karakter){location.replace('pilih-karakter.html');return;}document.getElementById('welcome').textContent='Selamat datang, '+out.player.nama_lengkap+'!';document.getElementById('info').textContent='Kelas '+out.player.kelas+' • Karakter: '+out.player.karakter+'. Permainan lengkap akan ditambahkan pada tahap berikutnya.';}catch(e){NGL.clear();location.replace('login.html');}document.getElementById('logout').onclick=()=>{NGL.clear();location.replace('login.html');};})();</script></body></html>
