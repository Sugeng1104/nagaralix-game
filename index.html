<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NARAGALIX — Petualangan Lintas Galaksi</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020714;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#intro{width:100%;height:100%;object-fit:contain;background:#000}#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:radial-gradient(circle at center,rgba(18,35,93,.84),rgba(1,4,18,.96));padding:24px;text-align:center;z-index:5}#overlay.show{display:flex}.logo{font-size:clamp(36px,8vw,90px);font-weight:1000;letter-spacing:.04em;color:#dff7ff;text-shadow:0 0 20px #00caff,0 0 50px #3156ff}.tagline{color:#d4e7ff;max-width:530px}button{cursor:pointer;border:1px solid #5ee6ff;border-radius:14px;padding:13px 20px;color:white;font-size:16px;font-weight:700;background:linear-gradient(120deg,#0966d5,#6133b9);box-shadow:0 0 22px #1377ff88}button:hover{filter:brightness(1.2)}#skip{position:fixed;right:20px;top:calc(18px + env(safe-area-inset-top));z-index:4;background:#041530bb;backdrop-filter:blur(8px);font-size:14px}#mute{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:4;background:#041530bb;font-size:14px}.hint{font-size:13px;color:#c6d5f6;max-width:550px}#error{display:none;color:#ffcccb}
</style>
</head>
<body>
<video id="intro" autoplay playsinline preload="auto" poster="" aria-label="Video pembuka NARAGALIX"><source src="intro-naragalix.mp4" type="video/mp4" type="video/mp4">Browser Anda tidak mendukung video MP4.</video>
<button id="skip" type="button">Lewati Intro →</button><button id="mute" type="button">🔊 Suara Aktif</button>
<section id="overlay" role="dialog" aria-label="Mulai video NARAGALIX"><div class="logo">NARAGALIX</div><div class="tagline">Nalar dan Petualangan Lintas Galaksi</div><button id="start" type="button">▶ Mulai Petualangan dengan Suara</button><div class="hint">Browser mungkin memerlukan satu ketukan untuk mengizinkan video bersuara.</div><div id="error">Video tidak dapat dimuat. Pastikan berkas MP4 berada di folder assets/video.</div></section>
<script>
(()=>{
'use strict';
const video=document.getElementById('intro'),overlay=document.getElementById('overlay'),start=document.getElementById('start'),mute=document.getElementById('mute');
const DESTINATION='register.html'; // Ganti menjadi dashboard.html jika login aktif, setelah autentikasi terpasang.
let done=false;
function next(){if(done)return;done=true;video.pause();window.location.href=DESTINATION;}
function soundButton(){mute.textContent=video.muted?'🔇 Aktifkan Suara':'🔊 Suara Aktif';}
async function playWithSound(){video.muted=false;video.volume=1;soundButton();try{await video.play();overlay.classList.remove('show');}catch(e){overlay.classList.add('show');}}
async function init(){video.muted=false;video.volume=1;soundButton();try{await video.play();overlay.classList.remove('show');}catch(e){video.pause();overlay.classList.add('show');}}
start.addEventListener('click',playWithSound);
document.getElementById('skip').addEventListener('click',next);
mute.addEventListener('click',async()=>{if(video.muted){await playWithSound();}else{video.muted=true;soundButton();}});
video.addEventListener('ended',next);
video.addEventListener('error',()=>{overlay.classList.add('show');document.getElementById('error').style.display='block';});
init();
})();
</script>
</body></html>
